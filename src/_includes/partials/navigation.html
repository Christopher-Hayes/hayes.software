<header-container class="relative z-50">
  <header class="sticky top-16">
    <nav class="relative mx-auto max-w-2xl h-12 px-0">
      <div
        class="h-full flex flex-row-reverse md:flex-row md:flex-wrap md:items-center justify-between divide-x-2 divide-fg">
        <ul class="h-full flex divide-x-2 divide-fg">
          {% for item in navigation.items %}
          <li class="h-full">
            <a href="{{ item.url }}"
              class="
                h-full w-[6.5rem] text-center text-base flex justify-center items-center px-4 py-1 pb-0.5 hover:decoration-fg dark:hover:decoration-bg focus:decoration-fg dark:focus:decoration-bg"
              :aria-current="activeLink === '{{ item.url }}' ? 'page' : null" rel="prefetch"
              onmouseover="if (window.htmlPreload) { window.htmlPreload('{{ item.url }}') }">
              {{ item.text }}
            </a>
          </li>
          {% endfor %}
        </ul>
        <a
          href="/" class="nav-home grow h-full block"
          rel="prefetch"
          onmouseover="if (window.htmlPreload) { window.htmlPreload('/') }"
          >
          <span class="h-full flex items-center px-6 py-1 pb-0.5">
            Home
          </span>
          <div class="absolute -right-2 -top-3">
            <span class="sr-only">Go to homepage</span>
            <svg height="4rem" width="9rem">
              <use href="#logo" />
            </svg>
          </div>
        </a>
      </div>
    </nav>
  </header>
</header-container>
