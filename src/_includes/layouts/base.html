<!DOCTYPE html>
<html lang="en">

<head>
  {% include "partials/site-head.html" %}
</head>

<body
  class="min-h-screen flex flex-col bg-bg dark:bg-bg text-fg dark:text-fg{% if page.url == '/' %} page-home{% endif %}"
  data-env="{{ node.env }}" data-page="{{ page.url }}">
  <div class="flex-grow relative">
    {% include "partials/navigation.html" %}
    <div id="main-content-wrapper" class="pt-4 md:pt-10 pb-8 md:pb-12">{% block content %}{% endblock %}</div>
  </div>
  <footer class="mt-16 mb-20 w-full max-w-2xl mx-auto flex gap-3">
    <button
      class="px-3.5 group flex justify-center items-center text-fg border border-fg dark:border-border bg-border dark:bg-bg hover:bg-primary-highlight hover:border-primary-highlight"
      onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
      <span class="sr-only">Jump back to top</span>
      <!-- overflow-visible is required to get Chrome to render the SVG correctly. -->
      <svg
        class="overflow-visible h-6 w-5 fill-current text-fg dark:text-fg group-hover:text-bg"
        alt=""
        >
        <use href="#back-to-top-icon" />
      </svg>
    </button>
    <div class="grow relative bg-border dark:bg-bg-raised border border-fg dark:border-none">
      <p class="px-6 pt-4 pb-3 prose prose-sm mx-auto w-full max-w-3xl">
        Edit this page
        <a class="dark:text-fg-highlight dark:hover:text-fg dark:hover:decoration-fg"
          href="https://github.com/Christopher-Hayes/hayes.software/edit/main/{{ page.inputPath }}" target="_blank"
          rel="noopener" id="edit-link">
          on GitHub
        </a>
      </p>

      <a href="/" class="group">
        <span class="sr-only">Go to homepage</span>
        <svg
          height="5rem" width="10rem" class="absolute -right-3 -top-3.5 mx-auto text-fg dark:text-bg group-hover:text-primary dark:group-hover:text-fg"
          alt=""
          >
          <use href="#logo" />
        </svg>
      </a>
    </div>
  </footer>
  <script type="module">
    const runDeferredScripts = async () => {
      // Dynamic import after page load
      const run = (await import('/main-on-ready.js')).run
      run()
    }

    // On idle
    window.addEventListener('load', () => {
      if ('requestIdleCallback' in window) {
        requestIdleCallback(runDeferredScripts)
      } else {
        // Fallback for Safari 15.6
        setTimeout(runDeferredScripts, 1)
      }
    })
  </script>
</body>

</html>
